id: password-spraying
name: Password spraying
description: One source IP tried many DIFFERENT usernames (low-and-slow guessing across accounts).
severity: high
enabled: true
type: threshold
mitre: {id: T1110.003, technique: Password Spraying, tactic: Credential Access}
conditions: {event_type: [login_failed, invalid_user]}
group_by: src_ip
distinct: user
threshold: 5
window: 300
